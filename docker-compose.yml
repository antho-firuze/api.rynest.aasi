services:
  php-webman:
    build:
      context: ./
      dockerfile: ./docker/php-webman/phpwebman.docker
    container_name: aasi-phpwebman
    restart: unless-stopped
    tty: true
    ports:
      - 8787:8787
      - 3131:3131
      - 3232:3232
      - 8888:8888
    volumes:
      - ./webman:/webman
      # This prevents the first volume from overriding the contents (especially for vendor folder).
      - /webman/vendor
    depends_on:
      - nginx
      - redis
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        
  nginx:
    build:
      context: ./
      dockerfile: ./docker/nginx/nginx.docker
    container_name: aasi-nginx
    restart: always
    tty: true
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./webman:/webman
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:latest
    container_name: aasi-redis
    restart: always
    tty: true
    ports:
      - 6379:6379
    working_dir: /data
    volumes:
      - redisdata:/data
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_HOST=127.0.0.1
    # Added explicit maxmemory configuration limits directly to the runtime command
    command:
      [
        "redis-server",
        "--appendonly",
        "no",
        "--save",
        "",
        "--maxmemory",
        "2gb",
        "--maxmemory-policy",
        "volatile-lru"
      ]
    # Allow the container to manage deep system threading loops safely
    privileged: true
    # command:
    #   [
    #     "redis-server",
    #     "--appendonly",
    #     "yes",
    #     "--replica-read-only",
    #     "no",
    #     "--rdbcompression",
    #     "no",
    #   ]
    # Grant kernel tuning parameters to the container
    sysctls:
      - net.core.somaxconn=65535
    # Prevent Docker from terminating Redis during intense background tasks
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      memlock:
        soft: -1
        hard: -1
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  redisdata:
    driver: local